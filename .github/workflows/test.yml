name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        three: ['0.160.0', 'latest']
    name: three ${{ matrix.three }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm i --no-save three@${{ matrix.three }} @types/three@${{ matrix.three }}
      - run: node -e "import('three').then(t => console.log('three r' + t.REVISION))"
      - run: npm test
      - run: npm run typecheck
