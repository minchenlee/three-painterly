<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tower Fireworks</title>
<style>
/* layout: a full-window canvas with one control panel (bottom left; a bottom sheet on phones) */
:root {
  --bg: #0b0f22; --panel: rgba(255, 255, 255, 0.92); --ink: #17191c; --muted: #6b7178; --line: rgba(0, 0, 0, 0.09);
  --soft: rgba(0, 0, 0, 0.05); --accent: #17191c; --accent-ink: #ffffff;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --panel: rgba(22, 24, 34, 0.9); --ink: #eceef0; --muted: #969ca6; --line: rgba(255, 255, 255, 0.1);
  --soft: rgba(255, 255, 255, 0.07); --accent: #eceef0; --accent-ink: #15171a; color-scheme: dark } }
:root[data-theme="dark"] {
  --panel: rgba(22, 24, 34, 0.9); --ink: #eceef0; --muted: #969ca6; --line: rgba(255, 255, 255, 0.1);
  --soft: rgba(255, 255, 255, 0.07); --accent: #eceef0; --accent-ink: #15171a; color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#ui { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 290px; max-height: calc(100% - 32px); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 12px;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25); }
#ui::-webkit-scrollbar { display: none; }
@media (max-width: 600px) {
  #ui { left: 0; right: 0; bottom: 0; width: auto; max-height: 56%; border-width: 1px 0 0; border-radius: 16px 16px 0 0;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  header p { display: none; }
}
header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
header p { margin: 4px 0 0; color: var(--muted); }
.grp { display: grid; gap: 8px; }
.lab { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); }
.lab output { color: var(--ink); font-variant-numeric: tabular-nums; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row .lab { flex: 1; }
button { font: inherit; color: var(--ink); background: var(--soft); border: 1px solid transparent; border-radius: 8px; padding: 5px 10px;
  cursor: pointer; min-height: 30px; }
button:hover { border-color: var(--line); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); min-width: 80px; font-weight: 500; }
.seg { display: inline-flex; background: var(--soft); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { background: transparent; min-height: 26px; padding: 3px 9px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--panel); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); }
input[type=range] { width: 100%; margin: 0; accent-color: var(--ink); }
details > summary { cursor: pointer; color: var(--muted); list-style-position: inside; }
details[open] > summary { margin-bottom: 8px; }
.meta { margin: 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.foot button { background: transparent; padding: 0; min-height: 0; color: var(--muted); }
.foot button:hover { color: var(--ink); border-color: transparent; }
#bShow { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
#liteNote { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  padding: 3px 9px; border-radius: 999px; background: var(--panel); color: var(--muted); font-size: 12px; }
html[data-ui-hidden] #liteNote { display: none !important; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="liteNote" hidden>Lite mode · fewer stars</div>
<button type="button" id="bShow" hidden aria-controls="ui" title="Show the panel (H)">Show controls</button>

<div id="ui">
  <header>
    <h1>Tower Fireworks</h1>
    <p>A 14 July show over a voxel Eiffel Tower. Every star is one dab of one pigment. Scrub the time, or play it backwards.</p>
  </header>

  <div class="grp">
    <div class="lab"><span>Time</span><output id="tOut">0.0 / 40.0 s</output></div>
    <input type="range" id="time" min="0" max="1000" value="0" aria-label="Time">
    <div class="row">
      <button type="button" id="bStart" title="Back to the start" aria-label="Back to the start">⏮</button>
      <button type="button" id="bRev">◀ Reverse</button>
      <button type="button" id="bPlay" class="primary">❚❚ Pause</button>
    </div>
    <div class="row"><span class="lab">Speed</span>
      <div class="seg" role="group" aria-label="Playback speed" id="speeds">
        <button type="button" data-s="0.1" aria-pressed="false">0.1×</button>
        <button type="button" data-s="0.25" aria-pressed="false">¼×</button>
        <button type="button" data-s="1" aria-pressed="true">1×</button>
        <button type="button" data-s="2" aria-pressed="false">2×</button>
      </div>
    </div>
  </div>

  <div class="grp">
    <div class="row"><span class="lab">Look</span>
      <div class="seg" role="group" aria-label="Look" id="looks">
        <button type="button" data-look="dabs" aria-pressed="true" title="Pointillist dabs (B switches)">Dabs</button>
        <button type="button" data-look="oil" aria-pressed="false" title="Impressionist oil strokes">Oil</button>
        <button type="button" data-look="cubes" aria-pressed="false" title="The plain voxel scene (P)">Cubes</button>
      </div>
    </div>
    <details id="more" open>
      <summary>Brush settings</summary>
      <div class="grp">
        <div class="lab"><span>Dab size</span><output id="szOut">6 px</output></div>
        <input type="range" id="size" min="3" max="16" step="1" value="6" aria-label="Dab size">
        <div class="lab"><span>Pigment purity</span><output id="puOut">0.80</output></div>
        <input type="range" id="purity" min="0" max="1" step="0.05" value="0.8" aria-label="Pigment purity">
        <div class="lab"><span>Glow</span><output id="glOut">0.7</output></div>
        <input type="range" id="glow" min="0" max="1.6" step="0.1" value="0.7" aria-label="Glow">
      </div>
    </details>
  </div>

  <div class="foot"><p class="meta" id="stat"></p><button type="button" id="bHide" title="Hide the panel (H)">Hide</button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { PainterlyPass, impressionist, pointillist } from '../../packages/painterly-pass/src/index.js';
import { BakedDebris } from '../../packages/baked-debris/src/index.js';

const $ = id => document.getElementById(id);
const QS = new URLSearchParams(location.search);
// lite mode (phones, narrow windows): pixel ratio 1, half the stars, a smaller painting. ?full=1 turns it off, ?lite=1 forces it.
const LITE = QS.get('full') === '1' ? false : QS.get('lite') === '1' || matchMedia('(pointer: coarse), (max-width: 820px)').matches;
$('liteNote').hidden = !LITE;
const NARROW = innerWidth <= 600, PORTRAIT = innerWidth / innerHeight < 0.8;
$('more').open = !NARROW;                                        // on a phone the panel starts short: time and look only
const T_END = 40;
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rnd = mulberry32(1889);   // one seed: the same show every time
const R = (a, b) => a + (b - a) * rnd();

const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, LITE ? 1 : 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // the plain path; PainterlyPass tone-maps by itself

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x141833, 0.00055);
const camera = new THREE.PerspectiveCamera(50, 1, 2, 9000);
camera.position.set(-190, 36, 560);
if (PORTRAIT) camera.position.set(-300, 30, 900);                // a tall window: step back, and aim lower so the panel covers ground, not sky
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, PORTRAIT ? 120 : 185, 0); controls.enableDamping = true; controls.minDistance = 150; controls.maxDistance = 1500;

/* ---------- night sky: a gradient dome that writes no depth, so the painter treats it as sky ---------- */
{
  const g = new THREE.SphereGeometry(6000, 32, 16), col = [], p = g.attributes.position;
  const zen = new THREE.Color(0x03050f), mid = new THREE.Color(0x0a0f2c), hor = new THREE.Color(0x2b2545), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const e = Math.max(0, p.getY(i) / 6000);                    // 0 at the horizon, 1 at the zenith
    c.copy(hor).lerp(mid, Math.min(1, e * 4)).lerp(zen, Math.min(1, Math.max(0, e - 0.2) * 1.6));
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, depthWrite: false, fog: false })));
}

/* ---------- lights: a dim blue night, plus one light that the bursts drive ---------- */
scene.add(new THREE.HemisphereLight(0x33457a, 0x0a0c16, 1.0));
const moon = new THREE.DirectionalLight(0x8fa8ff, 0.4); moon.position.set(300, 500, 200); scene.add(moon);
const flash = new THREE.PointLight(0xffffff, 0, 0, 0); scene.add(flash);          // decay 0: it lights the whole city
const flashAmb = new THREE.AmbientLight(0xffffff, 0); scene.add(flashAmb);

/* ---------- ground, river, lawns ---------- */
const std = (color, roughness = 0.95, metalness = 0) => new THREE.MeshStandardMaterial({ color, roughness, metalness });
function slab(w, d, x, z, y, mat) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat); m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); scene.add(m); return m; }
slab(9000, 9000, 0, 0, 0, std(0x1a1d2b));
slab(9000, 110, 0, 170, 0.4, std(0x0d2148, 0.22, 0.3));       // the Seine
slab(190, 580, 0, -360, 0.5, std(0x1b4226));                  // the long lawn behind the tower
slab(420, 300, 0, 400, 0.5, std(0x193d24));                   // the gardens on the near bank
const boxGeo = new THREE.BoxGeometry(1, 1, 1), M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), V3 = new THREE.Vector3(), S3 = new THREE.Vector3(), C = new THREE.Color();
function boxes(list, material) {   // list: [x, y, z, sx, sy, sz, colour]
  const m = new THREE.InstancedMesh(boxGeo, material, list.length);
  list.forEach((b, i) => { m.setMatrixAt(i, M4.compose(V3.set(b[0], b[1], b[2]), Q, S3.set(b[3], b[4], b[5]))); m.setColorAt(i, C.set(b[6])); });
  scene.add(m); return m;
}
{
  // city blocks on a street grid, with lit windows on the faces towards the river
  const blocks = [], lights = [];
  for (let gx = -14; gx <= 14; gx++) for (let gz = -13; gz <= 8; gz++) {
    const x = gx * 78, z = gz * 78 + 20;
    if (Math.abs(x) < 130 && z < 60) continue;                 // the lawn and the tower
    if (z > 80 && z < 260) continue;                           // the river and its quays
    if (z >= 260 && Math.abs(x) < 240) continue;               // the gardens
    const w = R(52, 64), d = R(52, 64), h = R(17, 30) + (rnd() < 0.06 ? 20 : 0);
    blocks.push([x, h / 2, z, w, h, d, C.setHSL(R(0.6, 0.7), R(0.12, 0.25), R(0.2, 0.3)).getHex()]);
    const n = LITE ? 5 : 12;
    for (let i = 0; i < n; i++) {
      const side = rnd() < 0.6 ? 0 : (rnd() < 0.5 ? 1 : 2), u = R(-0.44, 0.44), y = 4 + Math.floor(R(0, (h - 6) / 3.4)) * 3.4;
      const warm = C.setHSL(R(0.08, 0.13), 0.9, R(0.3, 0.62)).getHex();
      if (side === 0) lights.push([x + u * w, y, z + d / 2 + 0.3, 2.2, 2.4, 0.6, warm]);
      else lights.push([x + (side === 1 ? 1 : -1) * (w / 2 + 0.3), y, z + u * d, 0.6, 2.4, 2.2, warm]);
    }
  }
  // the bridge, quay lamps along the river, and trees beside the lawns
  blocks.push([0, 4, 170, 28, 8, 124, 0x55586a]);
  for (let x = -1500; x <= 1500; x += 34) for (const z of [108, 232]) { blocks.push([x, 3, z, 0.8, 6, 0.8, 0x333744]); lights.push([x, 6.6, z, 1.8, 1.8, 1.8, 0xffd9a0]); }
  for (let z = 118; z <= 222; z += 26) for (const x of [-13, 13]) lights.push([x, 9.4, z, 1.6, 1.6, 1.6, 0xffe0b0]);
  boxes(blocks, std(0xffffff, 0.9));
  boxes(lights, new THREE.MeshBasicMaterial({ color: 0xffffff }));
  const trees = [];
  for (let z = -640; z <= -90; z += 24) for (const x of [-108, 108]) trees.push([x + R(-3, 3), 8, z, R(11, 15), R(12, 17), R(11, 15), C.setHSL(R(0.3, 0.38), 0.45, R(0.1, 0.16)).getHex()]);
  for (let z = 270; z <= 540; z += 22) for (const x of [-196, -44, 44, 196]) trees.push([x + R(-2, 2), 6, z, R(8, 11), R(9, 12), R(8, 11), C.setHSL(R(0.3, 0.38), 0.45, R(0.08, 0.13)).getHex()]);
  boxes(trees, std(0xffffff, 1));
}

/* ---------- the tower: 3 m voxels on an exponential profile, with open lattice faces ---------- */
const VOX = 3;
const half = y => Math.max(4.5, 62.5 * Math.exp(-y / 88));    // half-width at height y (m): 125 m at the feet
const mod = (a, n) => ((a % n) + n) % n;
const PLATFORMS = [[57, half(57) + 5], [114, half(114) + 4], [276, 8]];   // [height, half-width]
function towerCell(i, j, k) {
  const x = (i + 0.5) * VOX, y = (j + 0.5) * VOX, z = (k + 0.5) * VOX, ax = Math.abs(x), az = Math.abs(z);
  for (const [y0, w] of PLATFORMS) if (y >= y0 && y < y0 + 2 * VOX && ax <= w && az <= w) return 2;
  if (y > 318) return 0;
  if (y > 282) return ax < VOX && az < VOX ? 1 : 0;           // the mast
  const h = half(y);
  if (ax > h || az > h) return 0;
  const outerX = ax > h - VOX, outerZ = az > h - VOX;
  const brace = (u, v) => mod(u + v, 4) === 0 || mod(u - v, 4) === 0;   // diagonal cross-bracing
  if (y < 114) {                                              // four legs
    const inner = h - Math.max(9, 0.42 * h);
    if (ax < inner || az < inner) {                           // between the legs: the arches under the first platform
      if (y >= 57) return 0;
      const arch = d => Math.abs(Math.hypot(d, y - 21.8) - 30.2) < 2.3 && y > 21.8;
      return (outerZ && ax < inner && arch(x)) || (outerX && az < inner && arch(z)) ? 2 : 0;
    }
    const innerX = ax < inner + VOX, innerZ = az < inner + VOX;
    if ((outerX || innerX) && (outerZ || innerZ)) return 1;   // the four corner posts of each leg
    if (outerX || innerX) return brace(k, j) ? 1 : 0;
    if (outerZ || innerZ) return brace(i, j) ? 1 : 0;
    return 0;
  }
  if (outerX && outerZ) return 1;                             // the single shaft above the second platform
  if (outerX) return y > 215 ? (j % 2 === 0 ? 1 : 0) : (brace(k, j) ? 1 : 0);
  if (outerZ) return y > 215 ? (j % 2 === 0 ? 1 : 0) : (brace(i, j) ? 1 : 0);
  return 0;
}
{
  const cells = [];
  for (let j = 0; j < 108; j++) for (let i = -24; i < 24; i++) for (let k = -24; k < 24; k++) {
    const kind = towerCell(i, j, k); if (!kind) continue;
    cells.push([(i + 0.5) * VOX, (j + 0.5) * VOX, (k + 0.5) * VOX, kind]);
  }
  // lit from within: gold above 1.0 (HDR), brighter on the platforms and towards the top
  const tower = new THREE.InstancedMesh(boxGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }), cells.length), col = new Float32Array(cells.length * 3);
  cells.forEach((b, i) => {
    tower.setMatrixAt(i, M4.compose(V3.set(b[0], b[1], b[2]), Q, S3.set(VOX, VOX, VOX)));
    const g = (b[3] === 2 ? 1.35 : 1.0) * R(0.45, 1.0) * (0.85 + 0.3 * b[1] / 320);
    col[i * 3] = 1.1 * g; col[i * 3 + 1] = 0.58 * g; col[i * 3 + 2] = 0.16 * g;
  });
  tower.instanceColor = new THREE.InstancedBufferAttribute(col, 3);
  scene.add(tower);
  const beacon = new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({ color: new THREE.Color(2.5, 2.5, 2.8) })); beacon.scale.set(3, 10, 3); beacon.position.set(0, 323, 0); scene.add(beacon);
}

/* ---------- the show: every star is a BakedDebris piece with its own velocity and launch time ----------
   Bullet time gives the drag: a star flies at full speed for WARP.burst seconds of its own clock, then almost hovers.
   So velocities and lifetimes below are in warped seconds; tau(t) converts real seconds since launch. */
const WARP = { burst: 0.35, hover: 0.16 };
const tau = t => WARP.burst * (1 - Math.exp(-t / WARP.burst)) + WARP.hover * t;
const HUE = { red: 0xff2a1a, gold: 0xffb02a, white: 0xfff1d8, blue: 0x4f8dff, green: 0x35e06a, violet: 0xb04cff, pink: 0xff4fa8, cyan: 0x35d8ff, orange: 0xff7a1a };
const pieces = [], shells = [];
const K = LITE ? 0.5 : 1;                                        // share of the stars
function sphereDir(i, n) {                                       // even directions, a little shaken
  const y = 1 - 2 * (i + 0.5) / n, r = Math.sqrt(1 - y * y), a = i * 2.39996323 + R(-0.2, 0.2);
  return [r * Math.cos(a), y, r * Math.sin(a)];
}
function rocket(from, to, tBurst, color, rise = 1.1) {           // a comet that shrinks away as it reaches the burst point
  const s = tau(rise);
  pieces.push({ position: from, velocity: [(to[0] - from[0]) / s, (to[1] - from[1]) / s + 20, (to[2] - from[2]) / s], launchTime: tBurst - rise, lifetime: s, size: 8, color, spin: 0 });
}
function shell(t, c, o = {}) {
  const { color = HUE.gold, core = null, n = 230, radius = 78, life = 2.6, kind = 'peony', from = [c[0] * 0.25, 0, c[2] - 30], power = 1 } = o;
  shells.push({ t, c, color: new THREE.Color(color), power });
  if (from) rocket(from, c, t, HUE.gold);
  const count = Math.round(n * K), speed = radius / WARP.burst;
  const tilt = new THREE.Quaternion().setFromEuler(new THREE.Euler(R(-0.6, 0.6), R(0, 3), R(-0.6, 0.6)));
  for (let i = 0; i < count; i++) {
    let d, s = speed * R(0.86, 1.1), col = color, T = life * R(0.8, 1.1), size = R(7, 10.5);
    if (kind === 'ring') { const a = (i / count) * Math.PI * 2; d = V3.set(Math.cos(a), R(-0.04, 0.04), Math.sin(a)).applyQuaternion(tilt).toArray(); }
    else d = sphereDir(i, count);
    if (core && i % 3 === 0) { s *= 0.5; col = core; }           // an inner sphere in a second colour
    const v = [d[0] * s, d[1] * s, d[2] * s];
    if (kind === 'willow') { v[1] -= 70; T = life * R(1.2, 1.7); size = R(5.5, 8); }   // slower, longer, weeping
    pieces.push({ position: c, velocity: v, launchTime: t + R(0, 0.04), lifetime: tau(T), size, color: col, spin: 0 });
  }
}
function fountain(t, at, dir, o = {}) {                          // sparks sprayed from a point on the tower for `dur` seconds
  const { color = HUE.gold, n = 240, dur = 2.6, speed = 150, spread = 0.35 } = o;
  for (let i = 0, count = Math.round(n * K); i < count; i++) {
    const d = V3.set(dir[0] + R(-spread, spread), dir[1] + R(-spread, spread), dir[2] + R(-spread, spread)).normalize(), s = speed * R(0.5, 1.1);
    pieces.push({ position: at, velocity: [d.x * s, d.y * s, d.z * s], launchTime: t + R(0, dur), lifetime: tau(R(0.9, 1.5)), size: R(4, 7), color: rnd() < 0.25 ? HUE.white : color, spin: 0 });
  }
}
function cascade(t, y0, w, dur) {                                // a waterfall of sparks from the rim of a platform
  for (let i = 0, count = Math.round(1100 * K); i < count; i++) {
    const a = R(-1, 1) * w, side = Math.floor(R(0, 4)), at = side < 2 ? [a, y0, (side ? 1 : -1) * w] : [(side === 2 ? 1 : -1) * w, y0, a];
    pieces.push({ position: at, velocity: [R(-12, 12), R(-190, -70), R(-12, 12)], launchTime: t + R(0, dur), lifetime: tau(R(1.4, 2.2)), size: R(4, 6.5), color: rnd() < 0.4 ? HUE.white : HUE.gold, spin: 0 });
  }
}
{
  const sky = (x, y, z = R(-160, -40)) => [x, y, z];
  // 0-7 s: the tricolour, twice
  for (let r = 0; r < 2; r++) {
    const t = 1.2 + r * 3.0, y = 300 + r * 70;
    shell(t, sky(-230, y), { color: HUE.blue, core: HUE.cyan, radius: 86, n: 260 });
    shell(t + 0.5, sky(0, y + 110, -90), { color: HUE.white, radius: 92, n: 260 });
    shell(t + 1.0, sky(230, y), { color: HUE.red, core: HUE.orange, radius: 86, n: 260 });
  }
  // 7-15 s: the tower sprays gold from its platforms while colour opens on both sides
  for (const [y, w] of [[60, 38], [117, 21]]) for (const sx of [-1, 1]) { fountain(7.2, [sx * w, y + 4, 0], [sx * 0.9, 0.7, 0], {}); fountain(10.6, [sx * w, y + 4, 0], [sx * 0.5, 1, 0.2], { color: HUE.white, n: 160 }); }
  fountain(8.4, [0, 284, 0], [0, 1, 0], { n: 300, speed: 190, spread: 0.6 });
  const mid = [HUE.green, HUE.pink, HUE.violet, HUE.cyan, HUE.orange, HUE.gold];
  for (let i = 0; i < 9; i++) { const sx = i % 2 ? 1 : -1; shell(7.6 + i * 0.8, sky(sx * R(120, 380), R(200, 400)), { color: mid[i % 6], core: i % 3 === 0 ? HUE.white : null, radius: R(58, 80), n: 200 }); }
  // 15-23 s: rings and weeping willows
  for (let i = 0; i < 7; i++) shell(15.2 + i * 0.95, sky((i % 2 ? 1 : -1) * R(90, 330), R(240, 420)), { kind: 'ring', color: [HUE.pink, HUE.cyan, HUE.green, HUE.violet][i % 4], radius: R(70, 96), n: 150, life: 2.2 });
  for (let i = 0; i < 4; i++) shell(16.4 + i * 1.7, sky([-260, 250, -90, 110][i], R(360, 450)), { kind: 'willow', color: HUE.gold, radius: 84, n: 280, life: 2.6, power: 1.3 });
  // 23-31 s: quick fire across the whole sky
  for (let i = 0; i < 20; i++) shell(23.2 + i * 0.38, sky(R(-420, 420), R(170, 430)), { color: Object.values(HUE)[Math.floor(R(0, 9))], core: rnd() < 0.3 ? HUE.white : null, radius: R(44, 74), n: 170, life: 2.0, power: 0.8 });
  for (const sx of [-1, 1]) { fountain(24, [sx * 38, 64, 0], [sx, 0.6, 0], { color: HUE.red, n: 200 }); fountain(27, [sx * 21, 121, 0], [sx, 0.8, 0], { color: HUE.blue, n: 200 }); }
  // 31-39 s: the finale. The tower pours gold, and the tricolour comes back at full size
  cascade(31, 57, 39, 5.5); cascade(31.6, 114, 22, 5);
  fountain(31, [0, 284, 0], [0, 1, 0], { n: 420, dur: 5.5, speed: 220, spread: 0.75, color: HUE.white });
  for (let i = 0; i < 5; i++) shell(31.4 + i * 0.75, sky([-330, 330, -170, 170, 0][i], R(390, 470)), { kind: 'willow', color: HUE.gold, radius: 100, n: 300, life: 2.8, power: 1.5 });
  for (let i = 0; i < 3; i++) {
    const t = 33.0 + i * 1.3;
    shell(t, sky(-300 + i * 40, 290 + i * 30), { color: HUE.blue, core: HUE.cyan, radius: 96, n: 280, power: 1.4 });
    shell(t + 0.25, sky(0, 440, -100), { color: HUE.white, radius: 100, n: 280, power: 1.4 });
    shell(t + 0.5, sky(300 - i * 40, 290 + i * 30), { color: HUE.red, core: HUE.orange, radius: 96, n: 280, power: 1.4 });
  }
}

// in the cube look the stars are unlit: black cubes that emit their own colour
const starMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 1, fog: false });
starMat.onBeforeCompile = sh => { sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += vColor.rgb * 2.2;'); };
const boom = new BakedDebris({
  pieces, bursts: [], gravity: 45, ground: null, killY: -1e6, duration: 3, step: 1 / 60, timeWarp: WARP,
  castShadow: false, receiveShadow: false, material: starMat,
  // unlaunched stars wait far below the ground; they come up 0.05 s early, so a stroke's look-back sample is already in place
  displace: { glsl: 'vec3 debrisDisplace(vec3 p, DebrisInfo d) { return d.local <= -0.05 ? vec3(0.0, -8000.0, 0.0) : vec3(0.0); }' },
});
boom.mesh.frustumCulled = false;
scene.add(boom.mesh);

/* ---------- painting, strokes, glow ---------- */
const brushes = { dabs: pointillist({ purity: 0.8, hueSpread: 0.05 }), oil: impressionist() };
const painter = new PainterlyPass(scene, camera, { brush: brushes.dabs, strokeSize: 6, saturation: 1.2, contrast: 1.12, colorJitter: 0.05, shadowAmount: 0.35, resolutionScale: LITE ? 0.55 : 0.7 });
const paintComposer = new EffectComposer(renderer), cubeComposer = new EffectComposer(renderer);
const paintBloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.7, 0.55, 0.72), cubeBloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.7, 0.6, 1.0);
paintComposer.addPass(painter); paintComposer.addPass(paintBloom);   // PainterlyPass writes the output colour space itself
cubeComposer.addPass(new RenderPass(scene, camera)); cubeComposer.addPass(cubeBloom); cubeComposer.addPass(new OutputPass());
function setGlow(g) { for (const b of [paintBloom, cubeBloom]) { b.strength = g; b.enabled = g > 0; } $('glOut').textContent = g.toFixed(1); }

let look = 'dabs';
// wide oil strokes leave fewer gaps: on a night sky the pale canvas between strokes would show as specks
const STROKE = { dabs: { strokeScale: 1.6, bright: 1.05, strokeWidth: 1, contrast: 1.12 }, oil: { strokeScale: 0.9, bright: 1.25, strokeWidth: 1.7, contrast: 1.22 } };
function setLook(name) {
  look = name;
  for (const b of $('looks').children) b.setAttribute('aria-pressed', String(b.dataset.look === name));
  if (name === 'cubes') { boom.removeStrokes(); }
  else {
    painter.brush = brushes[name];                                // the strokes follow painter.brush
    painter.strokeWidth = STROKE[name].strokeWidth; painter.contrast = STROKE[name].contrast;
    if (!boom.strokes) painter.overlayScene.add(boom.createStrokes({ painter, maxWidth: 30, jitter: 0.1 }));
    const u = boom.strokes.material.uniforms; u.uStrokeScale.value = STROKE[name].strokeScale; u.uBright.value = STROKE[name].bright;
  }
  $('purity').disabled = name !== 'dabs';
}

/* ---------- time ---------- */
const play = { t: 0, dir: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1, speed: 1 };
if (!play.dir) play.t = 34.6;                                    // a still frame from the finale
const fc = new THREE.Color();
function applyTime(t) {
  boom.setTime(t);
  // the bursts light the city: the sum of every recent shell, placed at the strongest one
  let best = 0, bx = 0, by = 300, bz = 0; fc.setRGB(0, 0, 0);
  for (const s of shells) { const a = t - s.t; if (a < 0 || a > 3) continue; const w = s.power * Math.exp(-a * 2.4); fc.r += s.color.r * w; fc.g += s.color.g * w; fc.b += s.color.b * w; if (w > best) { best = w; bx = s.c[0]; by = s.c[1]; bz = s.c[2]; } }
  const sum = Math.max(fc.r, fc.g, fc.b, 1e-4);
  flash.position.set(bx, by, bz); flash.color.copy(fc).multiplyScalar(1 / sum); flash.intensity = Math.min(sum, 2.2) * 1.1;
  flashAmb.color.copy(flash.color); flashAmb.intensity = Math.min(sum, 2.2) * 0.2;
}
function syncUI() {
  $('time').value = play.t / T_END * 1000; $('tOut').textContent = `${play.t.toFixed(1)} / ${T_END.toFixed(1)} s`;
  $('bPlay').textContent = play.dir === 1 ? '❚❚ Pause' : '▶ Play'; $('bRev').textContent = play.dir === -1 ? '❚❚ Pause' : '◀ Reverse';
}
$('time').oninput = e => { play.t = e.target.value / 1000 * T_END; play.dir = 0; syncUI(); };
$('bPlay').onclick = () => { play.dir = play.dir === 1 ? 0 : 1; syncUI(); };
$('bRev').onclick = () => { play.dir = play.dir === -1 ? 0 : -1; syncUI(); };
$('bStart').onclick = () => { play.t = 0; syncUI(); };
function setSpeed(s) { play.speed = s; for (const b of $('speeds').children) b.setAttribute('aria-pressed', String(+b.dataset.s === s)); }
for (const b of $('speeds').children) b.onclick = () => setSpeed(+b.dataset.s);
for (const b of $('looks').children) b.onclick = () => setLook(b.dataset.look);
$('size').oninput = e => { painter.strokeSize = +e.target.value; $('szOut').textContent = `${e.target.value} px`; };
$('purity').oninput = e => { brushes.dabs.uniforms.uPurity.value = +e.target.value; $('puOut').textContent = (+e.target.value).toFixed(2); };
$('glow').oninput = e => setGlow(+e.target.value);
function setPanel(show, byKey = false) { $('ui').hidden = !show; $('bShow').hidden = show || byKey; document.documentElement.toggleAttribute('data-ui-hidden', !show); }
$('bHide').onclick = () => setPanel(false); $('bShow').onclick = () => setPanel(true);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); $('bPlay').click(); return; }
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); play.t = Math.min(T_END, Math.max(0, play.t + (e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 1 : 0.25))); play.dir = 0; syncUI(); return; }
  switch (e.code) {
    case 'KeyR': $('bRev').click(); break;
    case 'Digit0': case 'Home': $('bStart').click(); break;
    case 'KeyB': setLook(look === 'dabs' ? 'oil' : 'dabs'); break;
    case 'KeyP': setLook(look === 'cubes' ? 'dabs' : 'cubes'); break;
    case 'KeyH': setPanel($('ui').hidden, true); break;
  }
});

/* ---------- loop ---------- */
function resize() {
  renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  for (const c of [paintComposer, cubeComposer]) { c.setPixelRatio(renderer.getPixelRatio()); c.setSize(innerWidth, innerHeight); }
}
addEventListener('resize', resize); resize();
setLook('dabs'); setGlow(0.7); syncUI();
const fps = { frames: 0, at: performance.now(), value: 0 };
function draw() {
  applyTime(play.t);
  controls.update();
  if (camera.position.y < 8) camera.position.y = 8;              // stay above the ground
  (look === 'cubes' ? cubeComposer : paintComposer).render();
}
let prev = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  if (play.dir) {
    play.t += dt * play.dir * play.speed;
    if (play.t > T_END) play.t = 0; else if (play.t < 0) play.t = T_END;   // the show loops both ways
    syncUI();
  }
  draw();
  if (++fps.frames >= 20) { fps.value = fps.frames * 1000 / (now - fps.at); fps.frames = 0; fps.at = now; $('stat').textContent = `${boom.stats.pieces.toLocaleString('en-US')} stars · ${fps.value.toFixed(0)} fps`; }
});
window.__ex = { boom, painter, play, setLook, applyTime, draw, syncUI, camera, controls, shells, renderer };
</script>
