<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BakedDebris example</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1d22; color: #eee; font: 13px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .ui { position: fixed; left: 12px; top: 12px; background: rgba(20,22,27,.85); padding: 10px 12px; border-radius: 8px; display: grid; gap: 6px; width: 240px; }
  .ui label { display: grid; gap: 2px; }
  .ui output { float: right; color: #aab; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; padding: 4px 8px; }
  input[type=range] { width: 100%; }
</style>
</head>
<body>
<div class="ui">
  <label>Time <output id="tOut">0.00 s</output><input type="range" id="time" min="0" max="1000" value="0"></label>
  <div class="row"><button id="play">Play</button><button id="rev">Rewind</button><button id="zero">0</button></div>
  <label><span><input type="checkbox" id="warp"> Bullet time</span></label>
  <label><span><input type="checkbox" id="paint"> Painterly + brush-stroke debris</span></label>
  <label><span><input type="checkbox" id="swirl"> Swirl (displace hook)</span></label>
  <label>Bounce <output id="bOut">0.35</output><input type="range" id="bounce" min="0" max="75" value="35"></label>
  <label>Secondary blasts <output id="sOut">0%</output><input type="range" id="sec" min="0" max="60" value="0"></label>
  <div id="stats" style="color:#99a"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { BakedDebris, boxCollider, anyCollider } from '../src/index.js';
import { PainterlyPass } from '../../painterly-pass/src/index.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x86acd6);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 300);
camera.position.set(12, 6, 14);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xd8e6ff, 0x8a7a60, 1.0));
const sun = new THREE.DirectionalLight(0xffe4c0, 3);
sun.position.set(-12, 16, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 });
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x7f9a5a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// a static wall the debris can bounce off
const WALL = { min: [-8, 0, -6.2], max: [8, 3, -5.8] };
const wall = new THREE.Mesh(new THREE.BoxGeometry(16, 3, 0.4), new THREE.MeshStandardMaterial({ color: 0xc9b89a }));
wall.position.set(0, 1.5, -6); wall.castShadow = wall.receiveShadow = true; scene.add(wall);

// two hollow voxel towers (0.25 m cubes); every cube is a piece, and only those a burst reaches will fly
const S = 0.25, pieces = [], cells = new Set();
const key = (i, j, k) => i + ',' + j + ',' + k;
function tower(ox, oz, w, h, d, tint) {
  for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) for (let k = 0; k < d; k++) {
    const shell = i === 0 || k === 0 || i === w - 1 || k === d - 1 || j === h - 1; if (!shell) continue;
    const win = (j % 6 >= 2 && j % 6 <= 3) && ((i % 4 === 2 && (k === 0 || k === d - 1)) || (k % 4 === 2 && (i === 0 || i === w - 1)));
    if (win) continue;
    const ii = Math.round(ox / S) + i, kk = Math.round(oz / S) + k;
    const c = new THREE.Color(j === h - 1 || j % 6 === 0 ? 0xb5553d : tint).offsetHSL(0, 0, (Math.random() - 0.5) * 0.06);
    pieces.push({ position: [(ii + 0.5) * S, (j + 0.5) * S, (kk + 0.5) * S], color: c.getHex() });
    cells.add(key(ii, j, kk));
  }
}
tower(-3, -1.5, 12, 22, 12, 0xe8dcc0);
tower(1.5, -2, 10, 28, 10, 0xd9cce0);

const bursts = [
  { position: [-1.5, 1.0, 1.4], direction: [0, 0.3, 1], radius: 1.6, time: 0.5 },
  { position: [2.75, 1.2, 0.5], direction: [0.4, 0.3, 1], radius: 1.7, time: 1.1 },
  { position: [-1.5, 4.5, 1.4], direction: [0, 0.3, 1], radius: 1.3, time: 1.6 },
];
// what stays standing is also solid: cells no burst reaches
const reached = p => bursts.some(b => Math.hypot(p[0] - b.position[0], p[1] - b.position[1], p[2] - b.position[2]) < b.radius);
const standing = new Set(pieces.filter(p => !reached(p.position)).map(p => key(Math.floor(p.position[0] / S), Math.floor(p.position[1] / S), Math.floor(p.position[2] / S))));
const solid = anyCollider(boxCollider([WALL]), (x, y, z) => standing.has(key(Math.floor(x / S), Math.floor(y / S), Math.floor(z / S))));

const boom = new BakedDebris({ pieces, bursts, solid, ground: 0, pieceSize: S, snap: S, duration: 12 });
scene.add(boom.mesh);
const stats = () => document.getElementById('stats').textContent = `${boom.stats.pieces} pieces · ${boom.stats.flying} fly · ${boom.stats.secondary} burst again`;
stats();

const painter = new PainterlyPass(scene, camera, { strokeSize: 7, saturation: 1.25 });
let strokes = null;
function setPaint(on) {
  if (on && !strokes) { strokes = boom.createStrokes({ painter }); painter.overlayScene.add(strokes); }
  if (!on && strokes) { boom.removeStrokes(); strokes = null; }
}

const T_END = 12, play = { t: 0, dir: 0 };
const $ = id => document.getElementById(id);
const sync = () => { $('time').value = play.t / T_END * 1000; $('tOut').textContent = play.t.toFixed(2) + ' s'; };
$('time').oninput = e => { play.t = e.target.value / 1000 * T_END; play.dir = 0; sync(); };
$('play').onclick = () => { if (play.t >= T_END) play.t = 0; play.dir = play.dir === 1 ? 0 : 1; };
$('rev').onclick = () => { if (play.t <= 0) play.t = T_END; play.dir = play.dir === -1 ? 0 : -1; };
$('zero').onclick = () => { play.t = 0; play.dir = 0; sync(); };
$('warp').onchange = e => boom.setTimeWarp(e.target.checked ? { burst: 0.3, hover: 1 / 25 } : null);
$('paint').onchange = e => setPaint(e.target.checked);
// displace hook: a GPU swirl on top of the bake. The angle stops growing when a piece comes to rest, so resting
// pieces stay put; y is untouched, so pieces stay on the floor (the bake does not know the swirl, walls can be crossed).
const swirl = {
  uniforms: { uSwirl: { value: 1.4 }, uCenter: { value: new THREE.Vector3(0.6, 0, 0.6) } },
  glsl: /* glsl */`
    uniform float uSwirl;
    uniform vec3 uCenter;
    vec3 debrisDisplace(vec3 p, DebrisInfo d) {
      if (d.local <= 0.0) return vec3(0.0);
      vec2 r = p.xz - uCenter.xz;
      float a = uSwirl * min(d.local, d.rest) / (1.0 + 0.25 * length(r));
      vec2 q = vec2(r.x * cos(a) - r.y * sin(a), r.x * sin(a) + r.y * cos(a));
      return vec3(q.x - r.x, 0.0, q.y - r.y);
    }`,
};
$('swirl').onchange = e => boom.setDisplace(e.target.checked ? swirl : null);
let timer;
$('bounce').oninput = e => { $('bOut').textContent = (e.target.value / 100).toFixed(2); clearTimeout(timer); timer = setTimeout(() => { boom.rebake({ restitution: e.target.value / 100 }); stats(); }, 150); };
$('sec').oninput = e => { $('sOut').textContent = e.target.value + '%'; clearTimeout(timer); timer = setTimeout(() => { boom.rebake({ secondary: e.target.value / 100 }); stats(); }, 150); };

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  const s = renderer.getDrawingBufferSize(new THREE.Vector2()); painter.setSize(s.x, s.y); }
addEventListener('resize', resize); resize();

let prev = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  if (play.dir) { play.t = Math.min(T_END, Math.max(0, play.t + dt * play.dir)); if (play.t === 0 || play.t === T_END) play.dir = 0; sync(); }
  boom.setTime(play.t);
  controls.update();
  if (strokes) painter.render(renderer); else renderer.render(scene, camera);
});
window.__ex = { boom, play, setPaint, camera, controls, sync, swirl };
</script>
</body>
</html>
