<!doctype html>
<meta charset="utf-8">
<title>baked-debris API tests</title>
<!-- Browser tests for the GPU side. Open over http (e.g. http://127.0.0.1:8000/packages/baked-debris/test/api.html);
     results are listed on the page and in window.__results. -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<pre id="out">running…</pre>
<script type="module">
import * as THREE from 'three';
import * as api from '../src/index.js';
const { BakedDebris } = api;
import { patchCube, strokeVertex, debrisState } from '../src/shaders.js';

const results = [];
const test = (name, fn) => { try { fn(); results.push({ name, ok: true }); } catch (e) { results.push({ name, ok: false, msg: String(e && e.message || e) }); } };
const ok = (v, msg) => { if (!v) throw new Error(msg || 'assertion failed'); };
const throws = (fn, re, msg) => { try { fn(); } catch (e) { if (re.test(e.message)) return; throw new Error(`${msg}: wrong error "${e.message}"`); } throw new Error(`${msg}: did not throw`); };

// 6 static pieces, 6 that fly (2 of them split into fragments)
const pieces = [];
for (let i = 0; i < 12; i++) pieces.push({ position: [i * 0.3 - 1.8, 0.5, 0], burst: i < 6 ? -1 : 0 });
const opts = (over = {}) => Object.assign({ pieces, bursts: [{ position: [0, 0.5, 0], radius: 2 }], secondary: 1, seed: 7 }, over);

test('B1: a passed material is cloned, not changed, and not disposed', () => {
  const own = () => {}; const m = new THREE.MeshStandardMaterial(); m.onBeforeCompile = own;
  let disposed = false; m.addEventListener('dispose', () => { disposed = true; });
  const b = new BakedDebris(opts({ material: m }));
  ok(b.mesh.material !== m, 'mesh uses the passed material itself');
  ok(m.onBeforeCompile === own, 'onBeforeCompile of the passed material was replaced');
  ok(m.vertexColors === false, 'vertexColors of the passed material was changed');
  b.dispose(); ok(!disposed, 'the passed material was disposed');
});

test('B1: the passed material\'s cache key is read on every call', () => {
  const m = new THREE.MeshStandardMaterial(); let tag = 'a'; m.customProgramCacheKey = () => tag;
  const b = new BakedDebris(opts({ material: m }));
  const k1 = b.mesh.material.customProgramCacheKey(); tag = 'b';
  ok(b.mesh.material.customProgramCacheKey() !== k1, 'cache key did not follow the passed material');
});

test('A6: point-light shadows use a patched distance material', () => {
  const b = new BakedDebris(opts());
  ok(b.mesh.customDistanceMaterial instanceof THREE.MeshDistanceMaterial, 'no customDistanceMaterial');
});

test('A7: createStrokes twice keeps one stroke mesh', () => {
  const b = new BakedDebris(opts()), s = new THREE.Scene();
  const s1 = b.createStrokes(); s.add(s1); const s2 = b.createStrokes(); s.add(s2);
  ok(!s1.parent, 'the first stroke mesh is still in the scene');
  ok(b.strokes === s2, 'strokes is not the new mesh');
});

test('A8: defaults are not shared, unknown options warn', () => {
  const warn = console.warn, seen = []; console.warn = (...a) => seen.push(a.join(' '));
  try {
    const b = new BakedDebris(opts({ speedd: 3 }));
    ok(b.o.speed !== BakedDebris.defaults.speed, 'speed array shared with defaults');
    ok(seen.some(s => /speedd/.test(s)), 'no warning for unknown option "speedd"');
    seen.length = 0; b.rebake({ gravityy: 1 });
    ok(seen.some(s => /gravityy/.test(s)), 'no warning for unknown rebake option "gravityy"');
  } finally { console.warn = warn; }
});

test('B2: a shader chunk that is not found throws', () => {
  const m = new THREE.MeshStandardMaterial(); m.userData.debrisUniforms = {};
  patchCube(m, { value: 0 });
  throws(() => m.onBeforeCompile({ vertexShader: 'void main() {}', fragmentShader: '', uniforms: {} }), /baked-debris.*#include <common>/, 'patchCube');
});

test('B5: strokeFragment comes from the public entry', () => {
  ok(typeof api.strokeFragment === 'string' && api.strokeFragment.includes('void main'), 'strokeFragment missing from index.js');
});

test('B6: createStrokes takes lookAhead', () => {
  const b = new BakedDebris(opts());
  ok(b.createStrokes().material.uniforms.uLookAhead?.value === -0.03, 'default lookAhead is not -0.03');
  ok(b.createStrokes({ lookAhead: 0.03 }).material.uniforms.uLookAhead.value === 0.03, 'lookAhead not used');
  ok(!/dbOffset = -0\.03/.test(strokeVertex), 'look-ahead still hard-coded');
});

test('C1: pieces are read by aIndex, only needed instances are drawn', () => {
  ok(!/gl_InstanceID/.test(debrisState + strokeVertex), 'shaders still use gl_InstanceID');
  const b = new BakedDebris(opts()), g = b.mesh.geometry, R = b.records;
  ok(g.attributes.aIndex, 'no aIndex attribute');
  const hidden = R.filter(d => d.hidden).length, stat = R.filter(d => d.kind === 0 && d.t0 >= 1e8).length;
  const fly = R.filter(d => d.kind === 0 && d.t0 < 1e8).length;
  ok(g.instanceCount === R.length - hidden, `cubes draw ${g.instanceCount}, want ${R.length - hidden}`);
  const s = b.createStrokes();
  ok(b.mesh.geometry.instanceCount === stat + fly, `cubes with strokes draw ${b.mesh.geometry.instanceCount}, want ${stat + fly}`);
  ok(s.geometry.instanceCount === R.length - hidden - stat, `strokes draw ${s.geometry.instanceCount}, want ${R.length - hidden - stat}`);
  b.removeStrokes(); ok(b.mesh.geometry.instanceCount === R.length - hidden, 'cube count not restored after removeStrokes');
});

test('C2: a texture larger than the GPU allows throws a clear error', () => {
  const b = new BakedDebris(opts());
  throws(() => b.mesh.onBeforeRender({ capabilities: { maxTextureSize: 1 } }), /maxTextureSize/, 'onBeforeRender');
});

test('C6: castShadow / receiveShadow options', () => {
  const b = new BakedDebris(opts({ castShadow: false, receiveShadow: false }));
  ok(b.mesh.castShadow === false && b.mesh.receiveShadow === false, 'shadow options ignored');
});

test('render: cubes, shadows and strokes compile without errors', () => {
  const r = new THREE.WebGLRenderer(); r.setSize(64, 64); r.shadowMap.enabled = true;
  const errs = []; r.debug.onShaderError = (gl, p, vs, fs) => errs.push(gl.getShaderInfoLog(vs) + gl.getShaderInfoLog(fs));
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(50, 1, 0.1, 100); cam.position.set(0, 2, 6);
  const sun = new THREE.DirectionalLight(); sun.castShadow = true; sun.position.set(3, 5, 2);
  const lamp = new THREE.PointLight(0xffffff, 5); lamp.castShadow = true; lamp.position.set(0, 2, 1);
  scene.add(sun, lamp);
  const b = new BakedDebris(opts()); scene.add(b.mesh); b.setTime(0.4); r.render(scene, cam);
  scene.add(b.createStrokes()); r.render(scene, cam);
  ok(errs.length === 0, errs.join('\n'));
  r.dispose();
});

// ---- displace hook ----
// one still piece at the origin, seen head-on: count lit pixels to see where the GPU put it
function litPixels(b, extra) {
  const r = new THREE.WebGLRenderer(), rt = new THREE.WebGLRenderTarget(32, 32);
  const errs = []; r.debug.onShaderError = (gl, p, vs, fs) => errs.push(gl.getShaderInfoLog(vs) + gl.getShaderInfoLog(fs));
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100); cam.position.set(0, 0, 3);
  scene.add(new THREE.AmbientLight(0xffffff, 3), b.mesh); if (extra) scene.add(extra);
  const px = new Uint8Array(32 * 32 * 4), count = () => { r.setRenderTarget(rt); r.render(scene, cam); r.readRenderTargetPixels(rt, 0, 0, 32, 32, px);
    let n = 0; for (let i = 0; i < px.length; i += 4) if (px[i] > 40) n++; return n; };
  return { count, r, errs, done: () => { rt.dispose(); r.dispose(); } };
}
const one = (over = {}) => new BakedDebris(Object.assign({ pieces: [{ position: [0, 0, 0], size: 0.5 }], bursts: [{ position: [9, 9, 9], radius: 0 }], ground: null }, over));
const lift = { uniforms: { uLift: { value: 50 } }, glsl: 'uniform float uLift;\nvec3 debrisDisplace(vec3 p, DebrisInfo d) { return vec3(0.0, uLift, 0.0); }' };

test('displace: the hook moves pieces on the GPU, setDisplace(null) removes it', () => {
  const b = one(), L = litPixels(b);
  ok(L.count() > 20, 'piece not visible without a hook');
  b.setDisplace(lift); ok(L.count() === 0, 'hook did not move the piece');
  b.setDisplace(null); ok(L.count() > 20, 'piece did not come back after setDisplace(null)');
  ok(L.errs.length === 0, L.errs.join('\n')); L.done();
});

test('displace: hook uniforms update live, without a new program', () => {
  const b = one({ displace: lift }), L = litPixels(b);
  ok(L.count() === 0, 'displace option ignored');
  const progs = L.r.info.programs.length; b.uniforms.uLift.value = 0;
  ok(L.count() > 20, 'uniform change not used'); ok(L.r.info.programs.length === progs, 'a uniform change recompiled');
  L.done();
});

test('displace: shadows and strokes compile with the hook and get its time', () => {
  const b = one({ displace: { glsl: 'vec3 debrisDisplace(vec3 p, DebrisInfo d) { return vec3(d.time + d.local + d.kind + d.burst + d.index + d.rest) * 0.0; }' } });
  const lamp = new THREE.PointLight(0xffffff, 5); lamp.castShadow = true; lamp.position.set(0, 2, 2);
  const sun = new THREE.DirectionalLight(); sun.castShadow = true;
  const L = litPixels(b, new THREE.Group().add(lamp, sun)); L.r.shadowMap.enabled = true; L.count();
  const s = b.createStrokes(); ok(/debrisDisplace\(vec3 p, DebrisInfo d\) \{ return vec3\(d\.time/.test(s.material.vertexShader), 'strokes lack the hook');
  b.mesh.parent.add(s); L.count();
  ok(L.errs.length === 0, L.errs.join('\n')); L.done();
});

test('displace: cache keys change with the hook code', () => {
  const b = one(), M = [b.mesh.material, b.mesh.customDepthMaterial, b.mesh.customDistanceMaterial];
  const k0 = M.map(m => m.customProgramCacheKey()); b.setDisplace(lift);
  M.forEach((m, i) => ok(m.customProgramCacheKey() !== k0[i], `cache key ${i} did not change`));
});

test('displace: a uniform name that clashes throws, bad options throw', () => {
  throws(() => one({ displace: { glsl: lift.glsl, uniforms: { uTime: { value: 0 } } } }), /uTime/, 'clash with uTime');
  throws(() => one().createStrokes() && one({ displace: { glsl: lift.glsl, uniforms: { uLookAhead: { value: 0 } } } }), /uLookAhead/, 'clash with uLookAhead');
  throws(() => one({ displace: { glsl: 3 } }), /displace/, 'glsl not a string');
  throws(() => one({ displace: { glsl: 'vec3 f() { return vec3(0.0); }' } }), /debrisDisplace/, 'no debrisDisplace');
});

window.__results = results;
document.getElementById('out').textContent = results.map(r => (r.ok ? 'ok   ' : 'FAIL ') + r.name + (r.msg ? '\n     ' + r.msg : '')).join('\n');
</script>
